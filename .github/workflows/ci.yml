# ตรวจทุก PR และทุก push ขึ้น main: lint, typecheck, เทสต์ (รวมตรวจรูปแบบ content/kb และ eval/questions) และ build
# ไม่รัน npm run eval ที่นี่ เพราะใช้โควตา AI จริงและต้องใช้ key — รันในเครื่องแล้วแปะผลใน PR แทน
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
